<!doctype html><html lang="es"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>20 trucos críticos para prompts</title><link rel="stylesheet" href="styles.css"/><style>
body{background:radial-gradient(circle at top left,#eaf6f0 0,transparent 34rem),#f4f7f6}.hero{background:linear-gradient(135deg,#dbeafe,#ecfdf5);border-bottom-color:#d6e4df}.eyebrow{color:#5b5ea6}.filters{display:flex;gap:.5rem;flex-wrap:wrap;margin:0 0 1rem}.filter{border:1px solid #d6e4df;border-radius:999px;background:#ffffffcc;padding:.65rem .9rem;font-weight:800;color:#3f5f57;cursor:pointer}.filter.active{background:#5b7c78;color:white}.trick-layout{display:grid;grid-template-columns:330px 1fr;gap:1rem}.trick-list{display:grid;gap:.55rem;align-content:start}.trick-tab{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:.75rem;cursor:pointer}.trick-tab.active{background:#5b7c78;color:white}.trick-tab small{display:block;opacity:.8;font-weight:800}.trick-panel{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:1.25rem}.method{display:flex;gap:.6rem;align-items:center;margin-bottom:.75rem}.pill{background:#7c6aa6;color:white;border-radius:999px;padding:.25rem .65rem;font-size:.8rem;font-weight:850}.compare{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.box{white-space:pre-wrap;border:1px solid var(--line);border-radius:16px;padding:1rem;line-height:1.5;background:#f7fbfa}.bad{background:#fff5f5}.good{background:#f1f8f5}.why{margin-top:1rem;border-top:1px solid var(--line);padding-top:1rem}.back-link{display:inline-flex;margin-bottom:1rem;text-decoration:none;color:#3f5f57;font-weight:800}@media(max-width:900px){.trick-layout,.compare,.level-grid{grid-template-columns:1fr}.trick-list{position:static}}

/* repair-visible-guide */
.filters{display:flex;gap:.5rem;flex-wrap:wrap;margin:0 0 1rem}.filter{border:1px solid #d6e4df;border-radius:999px;background:#ffffffcc;padding:.65rem .9rem;font-weight:800;color:#3f5f57;cursor:pointer}.filter.active{background:#5b7c78;color:white}.trick-layout{display:grid;grid-template-columns:330px 1fr;gap:1rem}.trick-list{display:grid;gap:.55rem;align-content:start}.trick-tab{text-align:left;border:1px solid #d6e4df;background:#ffffffcc;border-radius:16px;padding:.75rem;cursor:pointer;color:#243b37}.trick-tab.active{background:#5b7c78;color:white}.trick-tab small{display:block;opacity:.8;font-weight:800}.trick-panel{background:#fff;border:1px solid #d6e4df;border-radius:24px;box-shadow:0 18px 40px rgba(31,41,51,.08);padding:1.25rem}.method{display:flex;gap:.6rem;align-items:center;margin-bottom:.75rem}.pill{background:#7c6aa6;color:white;border-radius:999px;padding:.25rem .65rem;font-size:.8rem;font-weight:850}.compare{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.box{white-space:pre-wrap;border:1px solid #d6e4df;border-radius:16px;padding:1rem;line-height:1.5;background:#f7fbfa}.bad{background:#fff5f5}.good{background:#f1f8f5}.why{margin-top:1rem;border-top:1px solid #d6e4df;padding-top:1rem}@media(max-width:900px){.trick-layout,.compare{grid-template-columns:1fr}}
</style></head><body><header class="hero"><div><p class="eyebrow">UFV · Guía de cátedra</p><h1>Ingeniería de Prompts: el arte de conversar con la IA</h1><p class="subtitle">Guía interactiva: 20 trucos críticos para prompts, ordenados de más a menos trascendentes cognitivamente.</p></div></header><main class="container"><a class="back-link" href="index.html">← Volver al repositorio</a><section class="filters" id="filters"></section><section class="trick-layout"><nav id="trickList" class="trick-list"></nav><article id="trickPanel" class="trick-panel"></article></section></main><div id="toast" role="status" aria-live="polite"></div><script src="trucos-data.js"></script><script>
const cats=['Todos','Avanzado','Estructura','Control','Tono'];let current=0,cat='Todos';const list=document.querySelector('#trickList'),panel=document.querySelector('#trickPanel'),filters=document.querySelector('#filters'),toast=document.querySelector('#toast');function filtered(){return window.TRICKS.map((t,i)=>({t,i})).filter(x=>(cat==='Todos'||x.t[0]===cat))}function renderFilters(){filters.innerHTML=cats.map(c=>`<button class="filter ${c===cat?'active':''}" data-cat="${c}">${c}${c==='Todos'?' (1-20)':''}</button>`).join('')}function renderList(){const f=filtered();list.innerHTML=f.map(({t,i})=>`<button class="trick-tab ${i===current?'active':''}" data-i="${i}"><small>${t[0]} · TRUCO #${i+1}</small>${t[1]}</button>`).join('');if(!f.some(x=>x.i===current)&&f[0])current=f[0].i;renderPanel()}function renderPanel(){const t=window.TRICKS[current];panel.innerHTML=`<div class="method"><span class="pill">${t[0]}</span><span class="number">${String(current+1).padStart(2,'0')}</span><strong>MÉTODO #${current+1}</strong></div><h2>${t[1]}</h2><p><strong>💡 Concepto clave:</strong> ${t[2]}</p><div class="compare"><div class="box bad"><strong>❌ Mal escrito</strong>\n\n${t[3]}\n\nVago, ambiguo o proclive a respuestas genéricas.</div><div class="box good"><strong>✅ Excelente estructura</strong>\n\n${t[4]}\n\n<button class="copy" id="copy">📋 Copiar prompt</button></div></div><div class="why"><h3>🧠 ¿Por qué funciona pedagógicamente?</h3><p>${t[5]}</p></div>`}async function copy(){await navigator.clipboard.writeText(window.TRICKS[current][4]);toast.textContent='Prompt copiado';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1600)}filters.onclick=e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.cat;renderFilters();renderList()};list.onclick=e=>{const b=e.target.closest('button');if(!b)return;current=+b.dataset.i;renderList()};panel.onclick=e=>{if(e.target.id==='copy')copy()};renderFilters();renderList();
</script></body></html>
